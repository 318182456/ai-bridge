<section class="card queue-card"><div class="section-heading"><div><h2>执行队列</h2><p class="muted">实时查看请求、登录、校验和额度查询。取消中的任务会等待进程回收后释放位置。</p></div><button id="queueRefresh" class="secondary small">刷新</button></div>
<div id="queueSummary" class="summary-strip"></div><div class="filters"><label>查找任务<input id="queueSearch" type="search" placeholder="内容、账号、模型或请求 ID"/></label><label>状态<select id="queueState"><option value="">全部</option><option value="waiting">等待中</option><option value="running">执行中</option><option value="cancelling">取消中</option></select></label></div>
<p id="queueFeedback" class="feedback" role="status"></p><div class="scroll queue-scroll"><table><thead><tr><th>任务 / 内容摘要</th><th>账号 / 模型</th><th>状态 / 等待原因</th><th>时间</th><th>操作</th></tr></thead><tbody id="queueRows"></tbody></table></div>
<p class="muted note">内容仅在管理登录内查看，不写入请求日志；完成后队列项移除。网页后台任务的结果可在任务调试页恢复，模型接口仍按请求连接返回。</p></section>
<dialog id="queueDetail" class="detail-dialog"><div class="dialog-heading"><h2>任务内容</h2><button id="queueCloseDetail" class="secondary small">关闭</button></div><div class="dialog-body"><dl id="queueDetailMeta" class="info-grid"></dl><pre id="queueContent" tabindex="0"></pre><p id="queueConfirmText" hidden></p><button id="queueConfirmCancel" class="danger" hidden>确认取消任务</button></div></dialog>
