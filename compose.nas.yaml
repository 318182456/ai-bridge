# NAS：沿用 Dockhand 的共享 SSO 入口与代理。
name: ai-bridge
services:
  app:
    image: ghcr.io/318182456/ai-bridge:${IMAGE_TAG:-0.4.0-alpha.22}
    extends:
      file: ../all/compose-presets.yml
      service: web-sso-bridge-model-api
    # ASVS 8.3.1: model endpoints still require the application API key; admin pages retain SSO.
    labels:
      - "traefik.http.routers.${TRAEFIK_SUBDOMAIN}-model-api.rule=HostRegexp(`^${TRAEFIK_SUBDOMAIN}[.](${TRAEFIK_DOMAIN_REGEX})$$`) && (Path(`/v1`) || PathPrefix(`/v1/`) || Path(`/v1beta`) || PathPrefix(`/v1beta/`) || Path(`/aist/v1/models`) || Path(`/aist/v1/chat/completions`) || Path(`/robin/v1/models`) || Path(`/robin/v1/chat/completions`))"
    networks: [postgres-network]
    init: true
    restart: unless-stopped
    env_file: .env
    ports: ["18861:18861"]
    environment:
      PORT: "18861"
      DATA_DIR: /data
      NO_PROXY: ${NO_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-${HTTP_PROXY:-}}
    volumes: ["./data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  postgres-network:
    external: true
    name: postgres-network
