name: Native Linux packages
on:
  workflow_dispatch:
  push:
    branches: [agy]
    tags: ['v*']
permissions:
  contents: read
jobs:
  assemble:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate installer syntax
        run: sh -n scripts/install.sh
      - name: Install browser runtime for smoke test
        run: npx --no-install playwright-core install --with-deps chromium --no-shell
      - name: Verify sandboxed browser lifecycle
        run: node scripts/check-browser.mjs
      - name: Download and verify pinned official agy
        env:
          CLI_ARCHIVE_PATH: ${{ runner.temp }}/agy.tar.gz
        run: |
          node scripts/install-cli.mjs
          mkdir -p "$RUNNER_TEMP/ai-bridge-cli"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP/ai-bridge-cli" antigravity
      - name: Assemble native archive
        env:
          NATIVE_AGY_BIN: ${{ runner.temp }}/ai-bridge-cli/antigravity
          RELEASE_DIR: ${{ runner.temp }}/ai-bridge-release
          BROWSER_SMOKE_VERIFIED: 'true'
        run: node scripts/package-native.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ai-bridge-linux-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/ai-bridge-release/*.tar.gz
            ${{ runner.temp }}/ai-bridge-release/*.sha256
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-bridge-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-release
      - name: Verify and publish native packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_DIR: ${{ runner.temp }}/native-release
        run: |
          cd "$RELEASE_DIR"
          sha256sum --check ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          cp "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
          printf '%s\n' 'Experimental AI Bridge release. Includes amd64/arm64 Linux packages and installer; Google generation permissions still require per-account verification.' > notes.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS install.sh --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS install.sh --prerelease --title "AI Bridge ${GITHUB_REF_NAME#v}" --notes-file notes.txt
          fi
